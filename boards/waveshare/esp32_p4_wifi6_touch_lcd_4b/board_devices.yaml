devices:
  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      dac_channel_mask: "1"
    peripherals:
      - {name: gpio_pa_control, gain: 6, active_level: 1}
      - {name: i2s_audio_out}
      - {name: i2c_master, address: 0x30, frequency: 400000}

  - name: audio_adc
    chip: es7210
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      adc_max_channel: 4
      adc_channel_mask: "1111"
      adc_channel_labels: [FL, RE, FR, FC]
      adc_init_gain: 0
    peripherals:
      - {name: i2s_audio_in}
      - {name: i2c_master, address: 0x80, frequency: 400000}

  - name: display_lcd
    chip: st7703
    type: display_lcd
    sub_type: dsi
    dependencies:
      waveshare/esp_lcd_st7703: "2.0.0"
    config:
      reset_gpio_num: 27
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_BIG
      bits_per_pixel: 16
      reset_active_high: 0
      dbi_config: {virtual_channel: 0, lcd_cmd_bits: 8, lcd_param_bits: 8}
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 38
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 3
        flags: {use_dma2d: true, disable_lp: false}
        video_timing:
          h_size: 720
          v_size: 720
          hsync_back_porch: 50
          hsync_pulse_width: 20
          hsync_front_porch: 50
          vsync_back_porch: 20
          vsync_pulse_width: 4
          vsync_front_porch: 20
    peripherals:
      - {name: ldo_mipi}
      - {name: dsi_display}

  - name: lcd_touch
    chip: gt911
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_gt911: "*"
    config:
      io_i2c_config: {lcd_cmd_bits: 16}
      touch_config:
        x_max: 720
        y_max: 720
        int_gpio_num: -1
        rst_gpio_num: -1
        flags: {swap_xy: false, mirror_x: false, mirror_y: false}
    peripherals:
      - {name: i2c_master, i2c_addr: [0xBA, 0x28]}

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config: {default_percent: 80}
    peripherals:
      - {name: ledc_backlight}

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      vfs_config: {format_if_mount_failed: false}
      sub_config:
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 4
        pins: {clk: 43, cmd: 44, d0: 39, d1: 40, d2: 41, d3: 42}

